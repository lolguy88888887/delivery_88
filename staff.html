<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftRoute | Delivery Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🏍️ Courier Portal</h1>
            <select id="courier-session-select" onchange="switchCourierSession()" class="bg-slate-800 text-white border border-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium">
                <option value="">Select Your Name...</option>
            </select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
        <div id="login-prompt" class="bg-indigo-50 border border-indigo-200 p-6 rounded-2xl text-center">
            <h2 class="text-lg font-bold text-indigo-900 mb-1">Welcome to Courier Mode</h2>
            <p class="text-sm text-indigo-700">Please select your courier profile from the top right dropdown menu.</p>
        </div>

        <div id="courier-dashboard" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
                <h3 class="font-bold text-slate-900 text-lg" id="driver-profile-name">-</h3>
                <span class="inline-block bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-bold">On Duty</span>
                <div class="bg-slate-50 p-4 rounded-xl flex flex-col items-center justify-center space-y-2">
                    <p class="text-xs text-slate-500 font-semibold uppercase">Your Delivery QR</p>
                    <div id="qrcode" class="bg-white p-2 rounded-lg border flex justify-center"></div>
                    <p class="text-[10px] text-slate-400">Customer scans this upon delivery</p>
                </div>
            </div>

            <div class="md:col-span-2 space-y-4">
                <h2 class="text-lg font-bold text-slate-900">📋 Assigned Deliveries</h2>
                <div id="task-list" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzAlFc53i183dYa56nDFqEROIrJIiBUsg",
            authDomain: "delivery88-fffbf.firebaseapp.com",
            databaseURL: "https://delivery88-fffbf-default-rtdb.firebaseio.com",
            projectId: "delivery88-fffbf",
            storageBucket: "delivery88-fffbf.firebasestorage.app",
            messagingSenderId: "562400768958",
            appId: "1:562400768958:web:18ed68de521f548d853fef",
            measurementId: "G-4CE6JWR7SR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let drivers = {};
        let orders = {};
        let currentCourierId = null;

        onValue(ref(db, 'drivers'), (snapshot) => {
            drivers = snapshot.val() || {};
            const select = document.getElementById('courier-session-select');
            const val = select.value;
            select.innerHTML = `<option value="">Select Your Name...</option>` + Object.entries(drivers).map(([id, d]) => `<option value="${id}">${d.name}</option>`).join('');
            if(val) select.value = val;
        });

        onValue(ref(db, 'orders'), (snapshot) => {
            orders = snapshot.val() || {};
            renderTasks();
        });

        window.switchCourierSession = function() {
            currentCourierId = document.getElementById('courier-session-select').value;
            const driver = drivers[currentCourierId];

            if(currentCourierId && driver) {
                document.getElementById('login-prompt').classList.add('hidden');
                document.getElementById('courier-dashboard').classList.remove('hidden');
                document.getElementById('driver-profile-name').innerText = driver.name;

                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: `DRIVER_ID:${currentCourierId}:${driver.name}`,
                    width: 140,
                    height: 140
                });
            } else {
                document.getElementById('login-prompt').classList.remove('hidden');
                document.getElementById('courier-dashboard').classList.add('hidden');
            }
            renderTasks();
        }

        window.renderTasks = function() {
            if(!currentCourierId) return;
            const container = document.getElementById('task-list');
            const myOrders = Object.entries(orders).filter(([_, o]) => o.driverId === currentCourierId && o.status !== 'Delivered');

            if(myOrders.length === 0) return container.innerHTML = `<div class="bg-white p-6 rounded-2xl border text-center text-slate-500 text-sm">No active delivery tasks assigned to you.</div>`;

            container.innerHTML = myOrders.map(([id, o]) => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-mono font-bold text-indigo-600">ORD-${id.slice(-6).toUpperCase()}</span>
                            <h3 class="font-bold text-slate-900 text-base">${o.customerName}</h3>
                            <p class="text-slate-500 text-xs">📞 ${o.customerPhone}</p>
                        </div>
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold ${o.status === 'Assigned' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">${o.status}</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl text-xs space-y-1">
                        <p>📍 <strong>Address:</strong> ${o.customerAddress}</p>
                        <p>💰 <strong>Total:</strong> ₮${o.total?.toLocaleString()}</p>
                    </div>
                    ${o.status === 'Assigned' ? `
                        <button onclick="updateStatus('${id}', 'Picked Up')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl text-xs">Confirm Pickup from Merchant</button>
                    ` : `<p class="text-xs text-center text-indigo-600 font-semibold italic">En route! Ask customer to scan your QR code upon delivery.</p>`}
                </div>
            `).join('');
        }

        window.updateStatus = function(orderId, status) {
            update(ref(db, `orders/${orderId}`), { status });
        }
    </script>
</body>
</html>
