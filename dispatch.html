<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftRoute | Dispatch Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2 text-indigo-400">⚡ Dispatch Control Panel</h1>
            <div class="flex items-center gap-4 text-sm text-slate-400">
                <span>System: <strong class="text-emerald-400">Online (Firestore Live)</strong></span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <!-- Sidebar: Fleet Roster & Product Catalog Management -->
        <div class="space-y-6">
            <!-- Fleet Roster -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <h2 class="text-lg font-bold mb-4 text-white">🏍️ Delivery Fleet Roster</h2>
                <div id="driver-list" class="space-y-3 mb-4 max-h-60 overflow-y-auto">
                    <p class="text-slate-500 text-sm">Loading couriers...</p>
                </div>
                <div class="border-t border-slate-700 pt-4">
                    <h3 class="text-xs font-bold uppercase text-slate-400 mb-2">Add New Courier</h3>
                    <input type="text" id="new-driver-name" placeholder="Courier Name" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white mb-2">
                    <button onclick="addDriver()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-lg text-sm transition">Add Courier</button>
                </div>
            </div>

            <!-- Product Catalog Management -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <h2 class="text-lg font-bold mb-4 text-white">🛍️ Add Store Product</h2>
                <div class="space-y-3 mb-4">
                    <input type="text" id="new-prod-name" placeholder="Product Name" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
                    <input type="number" id="new-prod-price" placeholder="Price (₮)" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
                    <input type="text" id="new-prod-cat" placeholder="Category (e.g. Food, Groceries)" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
                    <button onclick="addProduct()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-sm transition">Publish to Store</button>
                </div>
            </div>
        </div>

        <!-- Orders Management Queue -->
        <div class="lg:col-span-3 space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-white">📦 Live Delivery Queue</h2>
                    <div class="flex gap-2">
                        <span id="stat-total" class="bg-slate-700 text-xs px-3 py-1.5 rounded-lg">Total: 0</span>
                        <span id="stat-unassigned" class="bg-amber-500/20 text-amber-400 text-xs px-3 py-1.5 rounded-lg font-semibold">Unassigned: 0</span>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
                            <tr>
                                <th class="p-3">Order ID</th>
                                <th class="p-3">Customer</th>
                                <th class="p-3">Destination</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Assigned Driver</th>
                                <th class="p-3">Rating</th>
                                <th class="p-3 text-right">Action / Assign</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="divide-y divide-slate-700">
                            <tr><td colspan="7" class="p-4 text-center text-slate-500">Loading orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzAlFc53i183dYa56nDFqEROIrJIiBUsg",
            authDomain: "delivery88-fffbf.firebaseapp.com",
            projectId: "delivery88-fffbf",
            storageBucket: "delivery88-fffbf.firebasestorage.app",
            messagingSenderId: "562400768958",
            appId: "1:562400768958:web:18ed68de521f548d853fef",
            measurementId: "G-4CE6JWR7SR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let drivers = [];
        let orders = [];

        onSnapshot(collection(db, "drivers"), (snapshot) => {
            drivers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderDrivers();
            renderOrders();
        });

        onSnapshot(collection(db, "orders"), (snapshot) => {
            orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            updateStats();
            renderDrivers();
            renderOrders();
        });

        window.renderDrivers = function() {
            const container = document.getElementById('driver-list');
            if(drivers.length === 0) {
                return container.innerHTML = `<p class="text-slate-500 text-sm">No couriers registered.</p>`;
            }

            container.innerHTML = drivers.map(d => {
                const driverOrders = orders.filter(o => o.driverId === d.id && o.rating);
                let avgRating = "N/A";
                if (driverOrders.length > 0) {
                    const sum = driverOrders.reduce((acc, o) => acc + o.rating, 0);
                    avgRating = (sum / driverOrders.length).toFixed(1) + " ★";
                }

                return `
                    <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 space-y-2">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="font-semibold text-white text-sm">${d.name}</p>
                                <span class="text-xs ${d.status === 'Online' ? 'text-emerald-400' : 'text-slate-500'}">● ${d.status}</span>
                            </div>
                            <button onclick="toggleDriver('${d.id}', '${d.status}')" class="text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded border border-slate-700 text-slate-300">Toggle</button>
                        </div>
                        <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-800 text-slate-400">
                            <span>Completed: <strong class="text-white">${driverOrders.length}</strong></span>
                            <span>Rating: <strong class="text-amber-400">${avgRating}</strong></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.toggleDriver = async function(id, currentStatus) {
            const newStatus = currentStatus === 'Online' ? 'Offline' : 'Online';
            await updateDoc(doc(db, "drivers", id), { status: newStatus });
        }

        window.addDriver = async function() {
            const name = document.getElementById('new-driver-name').value.trim();
            if(!name) return alert('Enter courier name');
            try {
                await addDoc(collection(db, "drivers"), { name, status: 'Online' });
                document.getElementById('new-driver-name').value = '';
                alert('Courier added successfully!');
            } catch(e) {
                alert('Error adding driver: ' + e.message);
            }
        }

        window.addProduct = async function() {
            const name = document.getElementById('new-prod-name').value.trim();
            const price = Number(document.getElementById('new-prod-price').value);
            const category = document.getElementById('new-prod-cat').value.trim() || 'General';
            if(!name || !price) return alert('Please enter product name and price');

            try {
                await addDoc(collection(db, "products"), { name, price, category });
                document.getElementById('new-prod-name').value = '';
                document.getElementById('new-prod-price').value = '';
                document.getElementById('new-prod-cat').value = '';
                alert('Product published to storefront!');
            } catch(e) {
                alert('Error adding product: ' + e.message);
            }
        }

        window.updateStats = function() {
            document.getElementById('stat-total').innerText = `Total: ${orders.length}`;
            document.getElementById('stat-unassigned').innerText = `Unassigned: ${orders.filter(o => o.status === 'Unassigned').length}`;
        }

        window.renderOrders = function() {
            const tbody = document.getElementById('orders-table-body');
            if(orders.length === 0) {
                return tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500">No active orders found.</td></tr>`;
            }

            const onlineDrivers = drivers.filter(d => d.status === 'Online');

            tbody.innerHTML = orders.map(o => {
                const shortId = `ORD-${o.id.slice(-6).toUpperCase()}`;
                const ratingBadge = o.rating ? `<span class="text-amber-400 font-bold">${o.rating} ★</span>` : `<span class="text-slate-500 text-xs">-</span>`;
                
                return `
                    <tr class="hover:bg-slate-900/50 transition">
                        <td class="p-3 font-mono text-xs font-bold text-indigo-300">${shortId}</td>
                        <td class="p-3">
                            <p class="font-medium text-white">${o.customerName}</p>
                            <p class="text-xs text-slate-400">${o.customerPhone}</p>
                        </td>
                        <td class="p-3 text-slate-300 max-w-xs truncate">${o.customerAddress}</td>
                        <td class="p-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${
                                o.status === 'Unassigned' ? 'bg-amber-500/20 text-amber-400' :
                                o.status === 'Assigned' ? 'bg-blue-500/20 text-blue-400' :
                                o.status === 'Picked Up' ? 'bg-purple-500/20 text-purple-400' :
                                'bg-emerald-500/20 text-emerald-400'
                            }">${o.status}</span>
                        </td>
                        <td class="p-3 text-slate-300">${o.driverName || 'Unassigned'}</td>
                        <td class="p-3">${ratingBadge}</td>
                        <td class="p-3 text-right">
                            ${o.status === 'Delivered' ? '<span class="text-xs text-slate-500 italic">Completed</span>' : `
                                <div class="flex justify-end gap-2 items-center">
                                    <select id="select-${o.id}" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                                        <option value="">Select Courier...</option>
                                        ${onlineDrivers.map(d => `<option value="${d.id}|${d.name}">${d.name}</option>`).join('')}
                                    </select>
                                    <button onclick="assignOrder('${o.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1 rounded text-xs">Assign</button>
                                </div>
                            `}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.assignOrder = async function(orderId) {
            const select = document.getElementById(`select-${orderId}`);
            const val = select.value;
            if(!val) return alert('Please select a courier first.');
            const [driverId, driverName] = val.split('|');

            await updateDoc(doc(db, "orders", orderId), {
                driverId: driverId,
                driverName: driverName,
                status: 'Assigned'
            });
        }
    </script>
</body>
</html>
